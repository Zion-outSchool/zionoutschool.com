<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Reset Portal Password | ZION outSchool</title>
    <link rel="stylesheet" href="gradebook.css?v=portal-admin-20261124">
    <link rel="stylesheet" href="portal-theme.css?v=1">
</head>
<body data-portal-password-reset="true" class="zion-portal">
    <header class="portal-topbar">
        <div class="portal-topbar-inner">
            <a class="portal-brand" href="family-portal.html">
                <span>Family Portal</span>
                <small>Zion outSchool</small>
            </a>
            <div class="portal-topbar-actions">
                <a class="portal-public-link" href="index.html">Back to Zion outSchool</a>
            </div>
        </div>
    </header>
    <main class="portal-account-main">
        <h1>Reset your portal password</h1>
        <p id="portal-reset-status" role="status" aria-live="polite"></p>
        <form id="portal-reset-request" class="gradebook-panel" method="post" hidden>
            <label>Portal email <input name="email" type="email" autocomplete="email" required></label>
            <p><button type="submit">Email a reset link</button></p>
        </form>
        <form id="portal-reset-password" class="gradebook-panel" method="post" hidden>
            <p id="portal-reset-email"></p>
            <label>New password <input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
            <label>Confirm password <input name="confirm" type="password" autocomplete="new-password" minlength="8" required></label>
            <p><button type="submit">Save new password</button></p>
        </form>
        <p><a href="family-portal.html">Back to Family Portal sign-in</a></p>
        <noscript><p>Enable JavaScript in your browser to reset your password.</p></noscript>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-portal.js?v=portal-password-reset-1"></script>
    <script src="portal-password-reset.js?v=1"></script>
</body>
</html>

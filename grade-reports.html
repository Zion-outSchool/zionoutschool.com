<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Reports | Zion outSchool</title>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=no-announcement-20261009">
    <link rel="icon" type="image/png" href="https://assets.zionoutschool.com/assets/images/favicon.ico">
    <link rel="apple-touch-icon" href="https://assets.zionoutschool.com/assets/images/favicon.ico">
    <link rel="stylesheet" href="portal-theme.css?v=portal-orange-1">
</head>
<body class="zion-portal editorial-page portal-page grade-reports-page" data-portal-page-role="active">
<header class="portal-topbar">
    <div class="portal-topbar-inner">
        <a class="portal-brand" href="family-portal.html">
            <span>Family Portal</span>
            <small>Zion outSchool</small>
        </a>
        <div class="portal-topbar-actions">
            <a class="portal-public-link" href="index.html">Back to Zion outSchool</a>
            <button class="portal-session-button" type="button" data-portal-sign-out hidden>Sign out</button>
        </div>
    </div>
</header>

<main class="grade-reports-panel" data-portal-page-content hidden>
    <div class="container">
        <div class="portal-page-intro">
            <h1>Grade Reports</h1>
            <p>Published grades, teacher feedback, and graduation progress for your family.</p>
        </div>

        <section class="family-grade-section" data-graduation-progress-view hidden aria-labelledby="family-course-grades-title">
            <h2 id="family-course-grades-title">Course grades</h2>
            <p class="portal-inline-status" data-graduation-progress-status role="status"></p>
            <div class="family-grade-cards" data-graduation-planner-readonly></div>
        </section>

        <section class="family-grade-section" aria-labelledby="published-reports-title">
            <h2 id="published-reports-title">Published reports and transcripts</h2>
            <p class="portal-inline-status" data-grade-reports-status role="status"></p>
            <div class="grade-reports-list" data-grade-reports-list></div>
            <p data-grade-reports-empty hidden>No PDFs have been published yet.</p>
        </section>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-portal.js?v=grade-views-1"></script>
</body>
</html>

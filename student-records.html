<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Student Records | ZION outSchool</title>
    <link rel="stylesheet" href="gradebook.css?v=student-records-20261124">
    <link rel="stylesheet" href="portal-theme.css?v=1">
</head>
<body class="zion-portal" data-portal-page-role="gradebook">
    <header class="portal-topbar">
        <div class="portal-topbar-inner">
            <a class="portal-brand" href="family-portal.html">
                <span>Family Portal</span>
                <small>Zion outSchool</small>
            </a>
            <div class="portal-topbar-actions">
                <a class="portal-public-link" href="index.html">Back to Zion outSchool</a>
                <button class="portal-session-button" type="button" data-portal-sign-out hidden>Sign out</button>
            </div>
        </div>
    </header>
    <main class="portal-account-main" data-portal-page-content hidden>
        <h1>Student Records</h1>
        <p id="student-records-status" role="status" aria-live="polite">Checking your sign-in…</p>
        <section id="student-records" hidden>
            <div class="gradebook-panel">
                <label>Registration record <select id="student-records-select"></select></label>
            </div>
            <article id="student-record-detail" class="gradebook-panel" hidden></article>
            <form id="student-record-link" class="gradebook-panel" hidden>
                <h2>Link to the school roster</h2>
                <p>Choose an existing student, or create a new student using this registration.</p>
                <label>Student <select name="student_id"></select></label>
                <button type="submit">Link registration</button>
            </form>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-portal.js?v=portal-ux-1"></script>
    <script src="student-records.js?v=communications-1"></script>
</body>
</html>
